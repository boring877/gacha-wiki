<!--
  Standalone maintenance page for Cloudflare Pages.
  Served at /maintenance/ — the catch-all in _redirects sends all traffic here.
  Self-contained (system fonts + inlined CSS + inline SVG) so it has no
  external asset dependencies, since the catch-all redirect intercepts everything.
  To take the site out of maintenance: delete this file and remove the
  MAINTENANCE MODE block at the top of _redirects.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GachaWiki — Under Maintenance</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(ellipse at top, #1b1f3a 0%, #0b0d1f 55%, #06070f 100%);
        color: #e7e9f3;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 540px;
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 3rem 2rem;
        backdrop-filter: blur(8px);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }
      .spinner {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.75rem;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .brand {
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 0.5px;
        margin: 0 0 0.5rem;
        background: linear-gradient(90deg, #9b8cff 0%, #6cc7ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
        color: #f4f5fb;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
        color: #b4b8d4;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5fd4a8;
        margin-right: 6px;
        vertical-align: middle;
        box-shadow: 0 0 10px #5fd4a8;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <svg class="spinner" viewBox="0 0 50 50" aria-hidden="true">
        <circle cx="25" cy="25" r="20" fill="none" stroke="rgba(155,140,255,0.18)" stroke-width="4" />
        <circle
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke="url(#g)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="90 150"
          stroke-dashoffset="0"
        />
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9b8cff" />
            <stop offset="100%" stop-color="#6cc7ff" />
          </linearGradient>
        </defs>
      </svg>

      <p class="brand">GachaWiki</p>
      <h1>We&rsquo;ll be right back</h1>
      <p>
        <span class="dot" aria-hidden="true"></span>
        GachaWiki is temporarily under maintenance. We&rsquo;re making a few updates and
        things will be back online shortly. Thanks for your patience!
      </p>
    </main>
  </body>
</html>
